name: test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        nvim: [stable, nightly]
    steps:
      - uses: actions/checkout@v4
      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: ${{ matrix.nvim }}
      - name: Lua smoke test
        run: nvim --headless -u NONE -l tests/smoke.lua
      - name: Python helper test
        run: python3 tests/test_minimal_diff.py
